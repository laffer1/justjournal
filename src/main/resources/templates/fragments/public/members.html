<div th:fragment="content" class="container">
    <div class="row">
        <div class="span12">
            <h2>Member List</h2>
            <p>A list of public journals. Private blogs are not listed.</p>
            <table border="0" cellpadding="1" cellspacing="1" style="border: thin solid #F2F2F2; font-size: 10px;">
                <thead>
                <tr class="tbhead">
                    <th>Members</th>
                    <th>Name</th>
                    <th>Journal Created</th>
                    <th>Profile</th>
                </tr>
                </thead>
                <tbody id="members-list"></tbody>
            </table>
            <p>Listed members: <span id="members-count">0</span></p>
            <div class="alert alert-danger" id="members-error" style="display:none;"></div>
        </div>
    </div>
</div>
