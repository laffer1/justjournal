<div th:fragment="content" class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Preferences</h2>
            <p>Permanently delete your account including all journal entries. This is permanent.</p>
            <form id="frmJournalDelete" role="form" class="form-horizontal">
                <fieldset>
                    <legend><strong>Delete Account</strong><br/></legend>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" id="confirm-delete" name="confirmDelete" required/>
                                    I understand my account and all journal entries will be permanently deleted.
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10">
                            <button class="btn btn-primary btn-md" type="submit">Delete Account</button>
                        </div>
                    </div>
                </fieldset>
            </form>
            <div class="alert alert-danger" id="delete-account-error" style="display:none;"></div>
            <div class="alert alert-success" id="delete-account-success" style="display:none;"></div>
        </div>
    </div>
</div>
